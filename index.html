<!DOCTYPE html>
<html>
  <head>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  </head>
  <body style="margin:0; display:flex; justify-content:center; align-items:center; height:100vh;">
    
    <!-- Remplacez liquide.glb par le nom exact de votre fichier 3D -->
    <model-viewer 
      src="gal-b-lantern-4120.glb" 
      ar 
      ar-modes="webxr scene-viewer quick-look" 
      camera-controls 
      auto-rotate 
      shadow-intensity="1">
      <button slot="ar-button" style="padding: 12px 24px; background: #007bff; color: white; border: none; border-radius: 8px; font-size: 16px;">
        Voir en Réalité Augmentée 📱
      </button>
    </model-viewer>

  </body>
</html>
